# À copier dans /etc/systemd/system/caddy.service.d/wait-time.conf
#
# Caddy ne démarre qu'une fois l'heure synchronisée : sinon il peut servir, ou émettre, un certificat daté d'une heure
# fausse, et le HTTPS échoue jusqu'à son prochain renouvellement.
[Unit]
After=time-sync.target
Wants=time-sync.target
