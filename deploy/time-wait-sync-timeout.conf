# À copier dans /etc/systemd/system/systemd-time-wait-sync.service.d/timeout.conf
#
# systemd-time-wait-sync retarde time-sync.target tant que l'heure n'est pas synchronisée (NTP). Sans délai maximum
# (infini par défaut), un réseau absent bloquerait le réveil et le HTTPS : au bout de 120 s ils démarrent quand même.
[Service]
TimeoutStartSec=120
